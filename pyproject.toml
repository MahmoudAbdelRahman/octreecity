[project]
name = "octreecity"
version = "0.1.0"
description = "Adaptive, application-independent voxel cities: compact column storage, octrees on demand, ray analyses, mesh and CFD export"
authors = [{ name = "Mahmoud AbdelRahman" }]
license = "MIT"
keywords = ["urban", "voxel", "octree", "city", "cfd", "gis", "sky view factor", "solar"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
octreecity = "octreecity.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
