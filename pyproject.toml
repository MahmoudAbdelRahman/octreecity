[project]
name = "octreecity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
