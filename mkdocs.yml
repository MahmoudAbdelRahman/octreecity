site_name: OctreeCity
site_description: Compact, adaptive voxel cities for street-level analysis, simulation and machine learning
repo_url: https://github.com/MahmoudAbdelRahman/octreecity
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      primary: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]
markdown_extensions: [admonition, tables, toc, pymdownx.highlight, pymdownx.superfences]
nav:
  - Home: index.md
  - Tutorials:
      - Quickstart: tutorials/quickstart.md
  - How-to guides:
      - Use your own data: how-to/own-data.md
      - Objects and queries: how-to/objects-and-queries.md
      - 3D views: how-to/3d-views.md
      - Sky view, shadows, sun hours: how-to/sky-and-sun.md
      - Whole cities: how-to/whole-cities.md
      - Export: how-to/export.md
      - Save and reuse results: how-to/save-and-reuse.md
      - Run the notebook: how-to/run-the-notebook.md
  - Explanation:
      - How OctreeCity works: explanation/how-it-works.md
      - Cells for learning: explanation/cells-for-learning.md
      - Adaptive cells: explanation/adaptive-cells.md
  - Reference:
      - Modules and functions: reference/api.md
      - Command line: reference/cli.md
      - File formats: reference/file-formats.md
