[project]
name = "octreecity"
version = "0.3.0"
description = "Adaptive octree cells for 3D space and AI: any data source, your own classes and split rules, cell tables, links and arrays for PyTorch; city tools for storage, sun and sky analysis, 3D views, mesh and CFD export"
authors = [{ name = "Mahmoud AbdelRahman" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["urban", "voxel", "octree", "city", "3d city model", "machine learning", "tokens", "pytorch", "cfd", "gis", "sky view factor", "solar", "citygml", "openstreetmap", "point cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pillow>=10.0",
    "pyproj>=3.6",
    "lxml>=5.0",
]

[project.optional-dependencies]
viz = ["plotly>=6.0", "matplotlib>=3.8"]
notebook = ["plotly>=6.0", "matplotlib>=3.8", "jupyterlab>=4.0", "ipykernel>=6.0"]
torch = ["torch>=2.1"]

[project.urls]
Homepage = "https://github.com/MahmoudAbdelRahman/octreecity"
Documentation = "https://github.com/MahmoudAbdelRahman/octreecity/tree/main/docs"
Issues = "https://github.com/MahmoudAbdelRahman/octreecity/issues"

[project.scripts]
octreecity = "octreecity.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "plotly>=6.0",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "kaleido>=1.5.0",
]
docs = [
    "mkdocs-material>=9.7.7",
]
